name: Backfill OnBuy Status

on:
  schedule:
    - cron: "15 * * * *"   # hourly, offset from the main sync's :00 slot
  workflow_dispatch:

# Shares the main sync workflow's concurrency group: requesting a new OnBuy
# token supersedes the one a still-running sync is using (mass mid-run 401s,
# seen 2026-07-06), so queue behind it instead of overlapping.
concurrency:
  group: onbuy-api
  cancel-in-progress: false

permissions:
  contents: write      # the nightly commits protected_skus.txt / hold_at_zero_skus.txt (what it zeroed stays zeroed)
  actions: read

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill OPC / Sync Status
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_TEST_CONSUMER_KEY: ${{ secrets.ONBUY_TEST_CONSUMER_KEY }}
          ONBUY_TEST_SECRET_KEY: ${{ secrets.ONBUY_TEST_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Reconciler alerts (refusals, big zero/delete batches) need mail settings;
          # DELIST_ALLOW_MASS=1 (repo variable) lets a deliberate mass cleanup through.
          DELIST_ALLOW_MASS: ${{ vars.DELIST_ALLOW_MASS }}
          # Oversell guard (oversell_guard.py) honours the store's push switch; OVERSELL_GUARD=0 is its kill switch.
          ONBUY_API_PUSH_ENABLED: ${{ vars.ONBUY_API_PUSH_ENABLED }}
          OVERSELL_GUARD: ${{ vars.OVERSELL_GUARD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python backfill_onbuy_status.py

      # ========== Nightly reconcile, embedded (2026-09-29, user-approved) =====
      # The standalone nightly's pending run was queue-bumped four nights
      # out of five: GitHub keeps ONE pending slot per concurrency group
      # and GTV's cron traffic always steals it. A fixed-hour gate does
      # not work either - GitHub delivers this "hourly" backfill only
      # 4-5 times a day at drifting hours (observed 15:23/21:57/01:54).
      # So: the FIRST backfill created each UTC day runs the reconcile
      # steps - guaranteed once per day at whatever hour that lands.
      # nightly_reconcile.yml stays dispatchable for one-off runs.
      - name: Nightly latch gate (first backfill of the UTC day)
        if: ${{ !cancelled() }}
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%Y-%m-%d)
          prior=$(gh api "repos/${{ github.repository }}/actions/workflows/backfill_onbuy_status.yml/runs?created=${today}T00:00:00Z..${today}T23:59:59Z&per_page=100" --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length" 2>/dev/null || echo error)
          echo "prior backfill runs created today: $prior"
          if [ "$prior" = "0" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "go=0" >> "$GITHUB_OUTPUT"; fi
      - name: Scan first tab (content + orphans, report)
        if: ${{ !cancelled() && steps.gate.outputs.go == '1' }}
        env:
          LISTINGS_CACHE: "listings_cache.json"
          SHEET_TAB: ""
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python scan_content_mismatch.py
      - name: Scan Amazon tab (content + orphans, report)
        if: ${{ !cancelled() && steps.gate.outputs.go == '1' }}
        env:
          LISTINGS_CACHE: "listings_cache.json"
          SHEET_TAB: "Amazon"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python scan_content_mismatch.py
      - name: Zero stock on mismatched (first tab)
        if: ${{ !cancelled() && steps.gate.outputs.go == '1' }}
        env:
          LISTINGS_CACHE: "listings_cache.json"
          SHEET_TAB: ""
          DRY_RUN: "0"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          PERSIST_HOLDS: "1"
        run: python zero_stock_mismatched.py
      - name: Zero stock on mismatched (Amazon tab)
        if: ${{ !cancelled() && steps.gate.outputs.go == '1' }}
        env:
          LISTINGS_CACHE: "listings_cache.json"
          SHEET_TAB: "Amazon"
          DRY_RUN: "0"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          PERSIST_HOLDS: "1"
        run: python zero_stock_mismatched.py
      # User 2026-10-13: "Delist every wrong listing from now and in future" - the listings the zero pass just found showing another product are
      # DELETED (the sheet row copied to a backup tab first, then the OnBuy listing), not frozen. Borderlines (word overlap 0.25-0.5, mostly the same
      # product worded differently) stay frozen for a human; same_product_skus.txt is never touched; the removed SKUs leave the hold lists before the
      # commit step below commits them. More than 60 in one night = refused (a broken read, not a clean-up).
      - name: Delete the listings that show another product (rows backed up first)
        if: ${{ !cancelled() && steps.gate.outputs.go == '1' }}
        continue-on-error: true
        env:
          SKUS_FILE: held_at_zero.txt
          KEEP_AT: "0.25"
          MAX_REMOVE: "60"
          BACKUP_TAB: "Removed wrong content (nightly)"
          DRY_RUN: "0"
          CLEAN_HOLDS: "1"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_TEST_CONSUMER_KEY: ${{ secrets.ONBUY_TEST_CONSUMER_KEY }}
          ONBUY_TEST_SECRET_KEY: ${{ secrets.ONBUY_TEST_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
        run: |
          python remove_wrong_content.py
          if grep -q . onbuy_delete_list.txt 2>/dev/null; then
            DELETE_SKUS_FILE=onbuy_delete_list.txt DRY_RUN=0 python delete_listings_batch.py
          else
            echo "no listing to delete on OnBuy"
          fi
      - name: Price/stock audit with fix (defended SKUs excluded)
        if: ${{ !cancelled() && steps.gate.outputs.go == '1' }}
        env:
          LISTINGS_CACHE: "listings_cache.json"
          FIX: "1"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python audit_price_drift.py

      - name: Keep what the nightly zeroed at zero for good (commit the hold lists)
        if: ${{ !cancelled() && steps.gate.outputs.go == '1' }}
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain -- protected_skus.txt hold_at_zero_skus.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- protected_skus.txt hold_at_zero_skus.txt
            git commit -m "nightly: keep the listings it zeroed at zero (protected_skus.txt + hold_at_zero_skus.txt)"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              sleep 6
            done
          else
            echo "no new holds to commit"
          fi
      - name: Sale price guard (end any sale price - the selling price is the direct price)
        if: ${{ !cancelled() && steps.gate.outputs.go == '1' }}
        env:
          LISTINGS_CACHE: "listings_cache.json"
          DRY_RUN: "0"
          VERIFY_SAMPLE: "0"
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python -u sale_guard.py

      # User 2026-10-26 (the one-click store sale on GTV): while a store sale is on (store_sale.json), listings created since and listings whose price changed
      # get the sale recomputed, a listing that moved into the excluded price range or under its floor loses it, so the whole store stays on the same rule.
      # Nothing happens when no sale is on. Shared sweep, no extra reads. Runs with the rest of the nightly (the first backfill of the UTC day).
      - name: Store sale refresh (keep the one-click sale on every listing while it is on)
        if: ${{ !cancelled() && steps.gate.outputs.go == '1' }}
        continue-on-error: true
        env:
          MODE: refresh
          LISTINGS_CACHE: "listings_cache.json"
          SHEET_NAME: ${{ vars.SHEET_NAME || 'OnBuy_Feed_Master' }}
          SEMI_SHEET_NAME: ${{ vars.SEMI_SHEET_NAME || '' }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_TEST_CONSUMER_KEY: ${{ secrets.ONBUY_TEST_CONSUMER_KEY }}
          ONBUY_TEST_SECRET_KEY: ${{ secrets.ONBUY_TEST_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
        run: python -u store_sale.py
