name: Barcode Probe (read-only)

# Asks OnBuy's catalogue whether a product already carries each SKU's barcode digits (GET /v2/products by product_code) and prints
# FREE / TAKEN with the product's OPC and name - run it on new SKUs BEFORE the sync creates them. GET only, writes nothing.
# Shares the API token with the sync, so it queues in the onbuy-api group.

on:
  workflow_dispatch:
    inputs:
      codes:
        description: "SKUs, comma-separated (their digits are looked up)"
        required: true
      field:
        description: "Search field (product_code, opc, name, mpn)"
        required: false
        default: "product_code"

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Probe
        env:
          CODES: ${{ inputs.codes }}
          FIELD: ${{ inputs.field }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
        run: python barcode_probe.py
