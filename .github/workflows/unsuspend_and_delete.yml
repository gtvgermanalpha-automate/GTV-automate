name: Unsuspend And Delete (one-off)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List without touching (yes/no)"
        default: "yes"
      skus:
        description: "Comma-separated SKUs (or use skus_file)"
        required: false
        default: ""
      skus_file:
        description: "Repo path of a one-SKU-per-line list"
        required: false
        default: ""

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unsuspend and delete
        env:
          DRY_RUN: ${{ inputs.dry_run == 'no' && '0' || '1' }}
          SKUS: ${{ inputs.skus }}
          SKUS_FILE: ${{ inputs.skus_file }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_TEST_CONSUMER_KEY: ${{ secrets.ONBUY_TEST_CONSUMER_KEY }}
          ONBUY_TEST_SECRET_KEY: ${{ secrets.ONBUY_TEST_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
        run: python unsuspend_and_delete.py
