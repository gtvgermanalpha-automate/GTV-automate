name: Dump Rows (read-only)

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Row numbers/ranges, e.g. 5807-5845"
        required: true
      raw:
        description: "Rows whose FULL description HTML to print"
        required: false
        default: ""
      scan_all:
        description: "Also scan every row for seller junk (yes/no)"
        required: false
        default: "no"

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Dump
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ROWS: ${{ inputs.rows }}
          RAW: ${{ inputs.raw }}
          SCAN_ALL: ${{ inputs.scan_all }}
        run: python dump_rows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dump-rows
          path: dump_rows.csv
          if-no-files-found: warn
