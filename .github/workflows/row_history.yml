name: Row History (read-only, from Drive revisions)

# Prints the stock / status / timestamp cells of named SKUs as they stood in earlier Drive revisions of the sheet (never a cost).
# Reads Drive + the sheet's revision exports only - no OnBuy, no writes - so it stays outside the onbuy-api group.

on:
  workflow_dispatch:
    inputs:
      skus:
        description: "SKUs, comma-separated, exactly as in the sheet"
        required: true
      revisions:
        description: "Drive revision ids, comma-separated (from restore_sku_column action=list)"
        required: true
      tab:
        description: "Worksheet(s), comma-separated"
        required: false
        default: "Amazon"

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install openpyxl
      - name: Print the cells
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SKUS: ${{ inputs.skus }}
          REVISIONS: ${{ inputs.revisions }}
          TAB: ${{ inputs.tab }}
        run: python row_history.py
