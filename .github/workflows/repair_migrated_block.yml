name: Repair Migrated Block (one-off)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report shifted rows without writing (yes/no)"
        default: "yes"

# Sheet writes race the sync's batch_update - queue behind OnBuy runs.
concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Repair shifted migration rows
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          DRY_RUN: ${{ inputs.dry_run == 'no' && '0' || '1' }}
        run: python repair_migrated_block.py
