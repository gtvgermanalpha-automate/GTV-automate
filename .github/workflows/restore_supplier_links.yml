name: Restore Supplier Links

on:
  workflow_dispatch:
    inputs:
      row_start:
        description: "First sheet row of the range to check"
        required: false
        default: "322"
      row_end:
        description: "Last sheet row of the range to check"
        required: false
        default: "817"
      dry_run:
        description: "yes = diagnose only; no = write mirror URLs back"
        required: false
        default: "yes"

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ROW_START: ${{ inputs.row_start }}
          ROW_END: ${{ inputs.row_end }}
          DRY_RUN: ${{ inputs.dry_run == 'no' && '0' || '1' }}
        run: python restore_supplier_links.py
